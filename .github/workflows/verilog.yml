name: Verilog Simulation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  simulate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Compile RTL and Testbench
        run: |
          iverilog -o sim rtl/and_gate.v tb/tb_and_gate.v

      - name: Run Simulation
        run: |
          vvp sim

      - name: Verify Waveform Exists
        run: |
          ls -l
          test -f wave.vcd

      - name: Upload Waveform Artifact
        uses: actions/upload-artifact@v4
        with:
          name: waveform
          path: wave.vcd

      - name: Create HTML Report
        run: |
          mkdir pages

          cat > pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>VLSI Simulation Report</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                margin: 40px;
              }
              h1 {
                color: #0366d6;
              }
            </style>
          </head>
          <body>
            <h1>Verilog Simulation Successful ✅</h1>

            <p>Simulation completed successfully.</p>

            <p>Download the waveform from:</p>

            <ul>
              <li>GitHub Actions → Latest Run → Artifacts → waveform</li>
            </ul>

            <p>Generated automatically by GitHub Actions.</p>

          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: simulate

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
